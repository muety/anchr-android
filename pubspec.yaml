name: anchr_android
description: Android client for Anchr.io link collections

version: 1.2.6+34

environment:
  sdk: ">=2.10.0 <3.0.0"
  flutter: 2.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^0.13.5
  url_launcher: ^6.1.2
  flutter_svg: ^1.0.3
  shared_preferences: ^2.0.15
  sqflite: ^2.0.2
  fluttertoast: ^8.1.3
  package_info: ^2.0.2
  f_logs: ^2.0.0
  device_info: ^2.0.3
  share: ^2.0.4

dev_dependencies:
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/no_content.svg
    - assets/loading.svg
    - assets/launcher_icon.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"